<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Factory · filter, map, reduce</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23bc4d25'/%3E%3Cpath d='M8 24V14l8-5v5l8-5v15Z' fill='%23f7f5ee'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head>
<body>
<main id="factory" tabindex="0" aria-label="Interactive program factory">
  <div id="bench" class="workbench-frame"><section class="workbench" aria-labelledby="factory-title">
    <div class="bench-header"><h2 id="factory-title">filter → map → reduce</h2><p class="bench-summary">Keep the even numbers, triple each one, and add them up.</p></div>
    <div class="bench-body"><nav id="process" class="process" aria-label="Process"></nav>
    <div class="factory-floor"><canvas id="scene" role="img" aria-label="Factory diagram. Input chest feeds a filter machine and filtered buffer, then a map machine and mapped buffer, then a sum accumulator."></canvas></div></div>
    <div class="transport"><div class="buttons"><button id="play" class="primary" disabled>Run factory <span aria-hidden="true">▶</span></button><button id="step" disabled>Step <span aria-hidden="true">→</span></button><button id="reset" disabled>Reset</button></div><label class="speed">SPEED <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><span class="keyboard-hint"><kbd>space</kbd> pause · <kbd>→</kbd> step</span></div>
    <p id="narration" class="sr-only" role="status" aria-live="polite">Loading the factory…</p>
  </section></div>
  <div class="workbench-frame reference"><section class="workbench" aria-labelledby="ops-title">
    <div class="bench-header"><h2 id="ops-title">Operations</h2><span class="bench-meta">JAVASCRIPT</span></div>
    <div class="blueprint"><div class="table-wrap"><table id="ops"><thead><tr><th scope="col">Step</th><th scope="col">Code</th><th scope="col">Reads</th><th scope="col">Returns</th></tr></thead><tbody id="ops-body"></tbody></table></div></div>
  </section></div>
</main><script type="module" src="./app.mjs"></script>
</body></html>
