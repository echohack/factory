id: no-comments-javascript
language: JavaScript
severity: error
message: Code comments are not allowed.
rule:
  any:
    - kind: comment
  not:
    regex: '^(#!|///\s*<reference|//\s*(eslint|oxlint|@ts-|@vitest-environment|@jest-environment|biome-ignore|prettier-ignore|oxfmt-ignore|tslint:)|/\*\s*(eslint|oxlint|global|prettier-ignore|oxfmt-ignore|@vite-ignore|[#@]__PURE__|webpack))'
ignores:
  - "**/auto-imports.d.ts"
  - "**/components.d.ts"
